allowBuilds:
  '@parcel/watcher': true
  esbuild: true
overrides:
  # Same decoding API, without the deprecated whatwg-encoding dependency.
  cheerio>encoding-sniffer: ^1.0.2
peerDependencyRules:
  # Hope rc.110 pins rc.31, but its Markdown plugins now require markdown-it 15.
  # rc.32 supplies it. client.ts also removes Hope's obsolete scroll handler.
  allowedVersions:
    vuepress: 2.0.0-rc.32
    '@vuepress/bundler-vite': 2.0.0-rc.32
