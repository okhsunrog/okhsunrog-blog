name: Deploy Blog

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # First day of each month at 06:00 Moscow time (03:00 UTC).
    - cron: "0 3 1 * *"

permissions:
  contents: read

concurrency:
  group: deploy-blog
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: |
          pnpm docs:check
          pnpm docs:build

      - name: Copy files via SSH
        uses: appleboy/scp-action@v1
        with:
          host: okhsunrog.dev
          username: blogdeploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: src/.vuepress/dist/*
          target: /var/www/blog/
          strip_components: 3
